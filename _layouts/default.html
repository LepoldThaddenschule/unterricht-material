<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} – {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- MathJax für LaTeX-Formeln -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
    async>
  </script>

  <style>
    body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1, h2, h3 {
      line-height: 1.2;
    }

    code {
      background: #f2f2f2;
      padding: 0.1rem 0.25rem;
      border-radius: 4px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 0.4rem 0.6rem;
      vertical-align: top;
    }

    th {
      background: #f5f5f5;
    }

    a {
      color: #0645ad;
    }
  </style>
</head>

<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
